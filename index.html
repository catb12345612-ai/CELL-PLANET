    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap');

        :root {
            /* Premium White & Gold Variables */
            --bg-light: #fcfcfc;
            --box-bg: #ffffff;
            --gold-main: #c5a059;
            --gold-light: rgba(197, 160, 89, 0.15);
            --gold-border: rgba(197, 160, 89, 0.4);
            --gold-gradient: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
            --text-main: #1a1a1a;
            --text-dim: #666666;
            --font-main: 'Space Grotesk', sans-serif;
            --radius-lg: 32px;
            --radius-md: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            background-color: var(--bg-light);
            background-image: 
                radial-gradient(circle at 100% 0%, var(--gold-light) 0%, transparent 40%),
                radial-gradient(circle at 0% 100%, var(--gold-light) 0%, transparent 40%);
            color: var(--text-main);
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Bento Grid Layout */
        .bento-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: minmax(100px, auto);
            gap: 16px;
            width: 100%;
            max-width: 900px;
            margin: 20px auto 60px;
        }

        /* Luxury Box Design */
        .bento-box {
            background: var(--box-bg);
            border: 1px solid var(--gold-border);
            border-radius: var(--radius-lg);
            padding: 30px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            flex-direction: column;
            animation: bentoEntrance 0.8s cubic-bezier(0.25, 1, 0.5, 1) backwards;
            box-shadow: 0 10px 30px rgba(197, 160, 89, 0.05);
        }

        .bento-box:hover {
            border-color: var(--gold-main);
            box-shadow: 0 20px 40px rgba(197, 160, 89, 0.15);
            transform: translateY(-4px) scale(1.01);
        }

        @keyframes bentoEntrance {
            0% { opacity: 0; transform: translateY(40px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Grid Placements */
        .box-header { grid-column: span 4; text-align: center; justify-content: center; align-items: center; padding: 40px 20px; }
        .box-showcase-1 { grid-column: span 2; grid-row: span 2; padding: 0; border: none; }
        .box-showcase-2 { grid-column: span 2; padding: 0; border: none; }
        .box-review { grid-column: span 4; }
        .box-actions { grid-column: span 2; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 20px; background: transparent; border: none; box-shadow: none; }
        .box-actions:hover { transform: none; box-shadow: none; border: none; }
        .box-guide { grid-column: span 2; justify-content: center; }
        .box-dev { grid-column: span 4; text-align: center; cursor: pointer; background: var(--box-bg); }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .bento-container { grid-template-columns: 1fr; }
            .box-header, .box-showcase-1, .box-showcase-2, .box-review, .box-actions, .box-guide, .box-dev { grid-column: span 1; }
            .box-showcase-1 { grid-row: span 1; height: 300px; }
            .box-showcase-2 { height: 250px; }
        }

        /* Header Styling */
        .brand-logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid var(--gold-main);
            margin-bottom: 20px;
            box-shadow: 0 10px 25px var(--gold-light);
            transition: transform 0.5s ease;
            background-color: #fff;
            object-fit: cover;
            padding: 4px;
        }
        .box-header:hover .brand-logo { transform: rotateY(180deg); }
        
        .brand-title {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: -1px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .brand-subtitle { font-size: 15px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

        /* Infinite Seamless 3D Image Slider */
        .showcase-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            overflow: hidden;
            background: #000; /* Dark backdrop to make images pop */
            border-radius: var(--radius-lg);
        }

        .slider-track {
            display: flex;
            width: max-content;
            height: 100%;
            animation: scrollSeamless 25s linear infinite;
        }

        .slider-track:hover {
            animation-play-state: paused; /* Pause on hover for viewing */
        }

        .slider-track img {
            width: 250px; /* Fixed width for uniform sliding */
            height: 100%;
            object-fit: cover;
            opacity: 0.85;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s;
            border-right: 2px solid rgba(255,255,255,0.1);
        }

        .slider-track img:hover {
            transform: scale(1.1);
            opacity: 1;
            z-index: 10;
        }

        @keyframes scrollSeamless {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); } /* Scrolls exactly halfway (1 full set) */
        }

        .showcase-label {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid var(--gold-main);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--gold-main);
            z-index: 15;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            pointer-events: none;
        }

        /* Actions Grid (Buttons) */
        .btn-action {
            background: #fff;
            border: 1px solid var(--gold-border);
            border-radius: var(--radius-md);
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 10px;
            gap: 10px;
            font-size: 13px;
            font-weight: 700;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }
        .btn-action span { font-size: 24px; }
        .btn-action:hover { background: var(--gold-main); color: #fff; transform: translateY(-5px); box-shadow: 0 10px 25px var(--gold-light); }
        .btn-call { grid-column: span 2; background: var(--gold-gradient); color: #fff; flex-direction: row; font-size: 16px; padding: 15px; border: none; }
        .btn-call:hover { opacity: 0.9; color: #fff; }

        /* Dynamic Review Gen */
        .review-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .review-header h3 { font-size: 18px; font-weight: 700; color: var(--gold-main); }
        
        .review-box {
            background: #fff;
            border: 2px dashed var(--gold-border);
            padding: 30px;
            border-radius: var(--radius-md);
            font-size: 18px;
            line-height: 1.6;
            cursor: pointer;
            transition: all 0.4s;
            position: relative;
            color: var(--text-main);
        }
        .review-box:hover {
            border-style: solid;
            border-color: var(--gold-main);
            background: var(--bg-light);
            box-shadow: 0 10px 30px var(--gold-light);
        }
        
        .review-box::after {
            content: "TAP TO COPY & RATE";
            display: block;
            margin-top: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--gold-main);
            transition: opacity 0.3s;
            opacity: 0.7;
        }
        .review-box:hover::after { opacity: 1; }

        .refresh-btn {
            background: var(--gold-light);
            border: 1px solid var(--gold-border);
            color: var(--gold-main);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s;
            padding: 8px 16px;
            border-radius: 20px;
        }
        .refresh-btn:hover { background: var(--gold-main); color: #fff; }

        /* Guide Steps */
        .steps-title { font-size: 14px; text-transform: uppercase; letter-spacing: 2px; color: var(--gold-main); margin-bottom: 20px; font-weight: 700; }
        .step-item { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; font-size: 15px; font-weight: 600; color: var(--text-main); }
        .step-item:last-child { margin-bottom: 0; }
        .step-circle {
            width: 32px; height: 32px; 
            border-radius: 50%; 
            border: 1px solid var(--gold-main); 
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700; background: var(--gold-light);
            color: var(--gold-main);
        }

        /* Developer Footer Section */
        .dev-link {
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            height: 100%;
        }
        
        .dev-img {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--gold-main);
            margin-bottom: 5px;
            box-shadow: 0 4px 15px var(--gold-light);
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            padding: 2px;
            background: #fff;
        }

        .dev-link:hover .dev-img {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 8px 20px rgba(197, 160, 89, 0.3);
        }

        .dev-badge {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--text-dim);
            font-weight: 700;
        }
        .dev-name {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: transform 0.3s ease;
        }
        .dev-link:hover .dev-name { transform: scale(1.05); }

        /* Direct Review Button */
        .btn-direct {
            display: block; width: 100%; padding: 16px; margin-top: 15px;
            text-align: center; text-decoration: none; color: var(--gold-main);
            background: #fff;
            border: 1px solid var(--gold-main); border-radius: var(--radius-md);
            font-weight: 700; font-size: 14px; letter-spacing: 1px;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            text-transform: uppercase;
        }
        .btn-direct:hover { background: var(--gold-main); color: #fff; box-shadow: 0 10px 20px var(--gold-light); }

        /* Toast & Animations */
        @keyframes flashEffect {
            0% { transform: scale(1); background: #fff; }
            50% { transform: scale(1.02); background: var(--gold-light); border-color: var(--gold-main); }
            100% { transform: scale(1); background: #fff; }
        }
        .flash-active { animation: flashEffect 0.5s ease-out; }

        .toast {
            visibility: hidden; min-width: 280px;
            background: var(--gold-gradient); color: #fff; text-align: center;
            border-radius: 50px; padding: 16px 24px;
            position: fixed; z-index: 9999; left: 50%; bottom: 30px;
            transform: translateX(-50%) translateY(20px); opacity: 0;
            font-size: 14px; font-weight: 700; box-shadow: 0 20px 40px rgba(197, 160, 89, 0.4);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .toast.show { visibility: visible; transform: translateX(-50%) translateY(0); opacity: 1; }

        /* Animation Delays for Grid */
        .box-header { animation-delay: 0.1s; }
        .box-showcase-1 { animation-delay: 0.2s; }
        .box-showcase-2 { animation-delay: 0.3s; }
        .box-actions { animation-delay: 0.4s; }
        .box-guide { animation-delay: 0.5s; }
        .box-review { animation-delay: 0.6s; }
        .box-dev { animation-delay: 0.7s; }
    </style>
</head>
